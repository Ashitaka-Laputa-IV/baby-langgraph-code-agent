[project]
name = "baby-code-agent"
version = "0.1.0"
description = "A small LangGraph code agent with a Rich terminal interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "rich>=13.9",
]

[project.scripts]
baby-code-agent = "baby_code_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baby_code_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
